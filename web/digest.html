<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>招标日报 · 技术标数据底座</title>
<style>
:root{
  --bg:#EFEDE8;--panel:#fff;--line:#D5D1C7;--line-2:#E9E6DF;
  --ink:#0A0A09;--ink-2:#3B3630;--ink-3:#6E675E;
  --accent:#C8371A;--accent-lite:#FF6A45;
  --ok:#2E6B3E;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --m:"SF Mono","JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 var(--f);-webkit-font-smoothing:antialiased}
header{height:52px;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
header h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap}
nav{display:flex;gap:2px;flex:1;overflow:auto}
nav a{font-size:13px;color:var(--ink-2);text-decoration:none;padding:5px 10px;border-bottom:2px solid transparent;white-space:nowrap}
nav a:hover{color:var(--accent)}
nav a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1080px;margin:0 auto;padding:18px 22px 80px}

.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{padding:6px 14px;border:1px solid var(--line);background:var(--panel);font:13px var(--f);cursor:pointer;color:var(--ink-2)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.kpi{display:flex;flex-wrap:wrap;border:1px solid var(--line);background:var(--panel);margin-bottom:16px}
.kpi div{flex:1 1 130px;padding:11px 15px;border-right:1px solid var(--line-2)}
.kpi div:last-child{border-right:0}
.kpi b{display:block;font:600 22px/1.2 var(--m)}
.kpi span{display:block;font-size:11px;color:var(--ink-3);margin-top:3px}

section{background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
section>h2{font-size:13px;font-weight:600;margin:0;padding:10px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:baseline;gap:8px}
section>h2 em{font:11.5px var(--m);color:var(--ink-3);font-style:normal;font-weight:400;margin-left:auto}
li{list-style:none}
.item{padding:10px 14px;border-bottom:1px solid var(--line-2)}
.item:last-child{border-bottom:0}
.item .t{font-size:13.5px;font-weight:500;line-height:1.5}
.item .t a{color:var(--ink);text-decoration:none}
.item .t a:hover{color:var(--accent);text-decoration:underline}
.item .m{font:11.5px var(--m);color:var(--ink-3);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.item .m b{color:var(--ink-2);font-weight:600}
.empty{color:var(--ink-3);padding:60px 0;text-align:center}
.err{border:1px solid var(--accent);background:#FFF6F3;color:#8A2A12;padding:10px 14px;margin-bottom:14px;font-size:13px;white-space:pre-wrap}
.more{padding:8px 14px;font-size:12px;color:var(--ink-3)}
a.lnk{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
@media (max-width:820px){ .kpi div{flex:1 1 50%} main{padding:14px} }
</style>
</head>
<body>
<header>
  <h1>招标日报</h1>
  <nav>
    <a href="/">数据</a>
    <a href="/check">自检</a>
    <a href="/project">项目</a>
    <a href="/digest" class="on">日报</a>
    <a href="/buyers.html">招标人</a>
    <a href="/model.html">模型</a>
    <a href="/simulator.html">模拟</a>
  </nav>
</header>

<main>
  <div class="tabs">
    <button data-d="1">近 1 天</button>
    <button data-d="2" class="on">近 2 天</button>
    <button data-d="7">近 7 天</button>
    <button data-d="30">近 30 天</button>
  </div>
  <div id="out"><div class="empty">载入中…</div></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wan = (n) => n == null ? null : (n / 1e4).toFixed(0) + ' 万';

async function load(days) {
  $('out').innerHTML = '<div class="empty">载入中…</div>';
  let j;
  try {
    j = await (await fetch('/api/digest?days=' + days)).json();
  } catch (e) {
    $('out').innerHTML = `<div class="err">${esc(e.message)}</div>`;
    return;
  }
  if (!j.ok) { $('out').innerHTML = `<div class="err">${esc(j.error)}</div>`; return; }
  render(j.data);
}

function render(d) {
  const groups = d.groups || [];
  let h = '<div class="kpi">'
    + `<div><b>${d.total ?? 0}</b><span>${esc(d.date || '')} 新增</span></div>`
    + groups.map((g) => `<div><b>${g.count}</b><span>${esc(g.tag)}</span></div>`).join('')
    + '</div>';

  if (!d.total) {
    h += '<div class="empty">这个窗口内没有新增招标公告<br><br>如果刚过周末属正常；持续为空请检查爬虫日志 data/crawl.log</div>';
  } else {
    for (const g of groups) {
      h += `<section><h2>${esc(g.tag)}<em>${g.count} 条</em></h2>`;
      h += '<ul>' + g.items.map((it) => {
        const bits = [it.city, it.pubDate].filter(Boolean).map(esc);
        if (it.amount) bits.push('限价 <b>' + wan(it.amount) + '</b>');
        if (it.days) bits.push('工期 <b>' + it.days + '</b> 天');
        return `<li class="item">
          <div class="t"><a href="/project?g=${encodeURIComponent(it.guid)}">${esc(it.title)}</a></div>
          <div class="m">${bits.join(' · ')}${it.url ? ` · <a class="lnk" href="${esc(it.url)}" target="_blank" rel="noreferrer">原文</a>` : ''}</div>
        </li>`;
      }).join('') + '</ul>';
      if (g.count > g.items.length) h += `<div class="more">还有 ${g.count - g.items.length} 条（列表只展示前 ${g.items.length} 条）</div>`;
      h += '</section>';
    }
  }
  $('out').innerHTML = h;
}

document.querySelectorAll('.tabs button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    const d = Number(b.dataset.d);
    history.replaceState(null, '', '/digest?days=' + d);
    load(d);
  };
});

const init = Number(new URLSearchParams(location.search).get('days') || 2);
document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', Number(b.dataset.d) === init));
load(init);
</script>
</body>
</html>
