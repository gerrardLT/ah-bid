<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>招标日报 · 技术标数据底座</title>
<style>
:root{
  --bg:#EFEDE8;--panel:#fff;--line:#D5D1C7;--line-2:#E9E6DF;
  --ink:#0A0A09;--ink-2:#3B3630;--ink-3:#6E675E;
  --accent:#C8371A;--accent-lite:#FF6A45;
  --ok:#2E6B3E;--warn:#B26A00;--bad:#C8371A;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --m:"SF Mono","JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 var(--f);-webkit-font-smoothing:antialiased}
header{height:52px;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
header h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap}
nav{display:flex;gap:2px;flex:1;overflow:auto}
nav a{font-size:13px;color:var(--ink-2);text-decoration:none;padding:5px 10px;border-bottom:2px solid transparent;white-space:nowrap}
nav a:hover{color:var(--accent)}
nav a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
header .meta{font:11.5px var(--m);color:var(--ink-3);white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:16px 20px 90px}

/* 时间窗 */
.tabs{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.tabs button{padding:6px 14px;border:1px solid var(--line);background:var(--panel);font:13px var(--f);cursor:pointer;color:var(--ink-2)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tabs .sp{flex:1}
.tabs .btn-x{padding:6px 12px;border:1px solid var(--line);background:var(--panel);font:12.5px var(--f);cursor:pointer;color:var(--ink-2)}
.tabs .btn-x:hover{border-color:var(--accent);color:var(--accent)}

/* 筛选条 */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);padding:10px 12px;margin-bottom:12px}
.filters select,.filters input[type=text],.filters input[type=number]{
  padding:6px 8px;border:1px solid var(--line);background:#FBFAF7;font:13px var(--f);color:var(--ink);min-width:0
}
.filters input[type=text]{flex:1;min-width:150px}
.filters input[type=number]{width:96px}
.filters label{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.filters .hint{font:11px var(--m);color:var(--ink-3)}
.filters .fil{padding:6px 11px;border:1px solid var(--line);background:#fff;font:12.5px var(--f);cursor:pointer;color:var(--ink-2)}
.filters .fil.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.filters .clr{padding:6px 11px;border:0;background:transparent;color:var(--ink-3);font:12.5px var(--f);cursor:pointer;text-decoration:underline}

/* KPI */
.kpi{display:flex;flex-wrap:wrap;border:1px solid var(--line);background:var(--panel);margin-bottom:12px}
.kpi div{flex:1 1 130px;padding:10px 15px;border-right:1px solid var(--line-2)}
.kpi div:last-child{border-right:0}
.kpi b{display:block;font:600 22px/1.2 var(--m)}
.kpi span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.kpi .b b{color:var(--bad)}
.kpi .w b{color:var(--warn)}
.kpi .m b{color:var(--ink-3)}

/* 区块 */
section{background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
section>h2{font-size:13px;font-weight:600;margin:0;padding:9px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:baseline;gap:8px}
section>h2 em{font:11.5px var(--m);color:var(--ink-3);font-style:normal;font-weight:400;margin-left:auto}
section.urgent{border-left:3px solid var(--bad)}
section.urgent>h2{color:var(--bad)}
ul{margin:0;padding:0}
.item{list-style:none;padding:9px 14px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;align-items:flex-start}
.item:last-child{border-bottom:0}
.item:hover{background:#FBFAF7}
.item.focus{background:#FFF6F3}
.item.read{opacity:.55}
.item.read .t{border-left:2px solid var(--line);padding-left:8px}
.item .fav{flex:none;cursor:pointer;font-size:15px;line-height:1.4;color:var(--line);user-select:none;width:16px;text-align:center}
.item .fav.on{color:var(--warn)}
.item .body{flex:1;min-width:0}
.item .t{font-size:13.5px;font-weight:500;line-height:1.5}
.item .t a{color:var(--ink);text-decoration:none}
.item .t a:hover{color:var(--accent);text-decoration:underline}
.item .m{font:11.5px var(--m);color:var(--ink-3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.item .m b{color:var(--ink-2);font-weight:600}
.item .due{flex:none;font:600 11.5px var(--m);padding:2px 8px;border:1px solid var(--line);white-space:nowrap}
.item .due.r{border-color:var(--bad);color:var(--bad);background:#FFF6F3}
.item .due.w{border-color:var(--warn);color:var(--warn);background:#FFF9EC}
.item .due.n{border-color:var(--line);color:var(--ink-3)}
.q{color:var(--warn);cursor:help;font-weight:600}
.empty{color:var(--ink-3);padding:40px 0;text-align:center;font-size:13px}
.err{border:1px solid var(--bad);background:#FFF6F3;color:#8A2A12;padding:10px 14px;margin-bottom:12px;font-size:13px;white-space:pre-wrap}
.more{padding:8px 14px;font-size:12px;color:var(--ink-3)}
a.lnk{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}

@media (max-width:820px){
  .kpi div{flex:1 1 50%}
  main{padding:12px}
  .filters input[type=text]{min-width:110px}
}
</style>
</head>
<body>
<header>
  <h1>招标日报</h1>
  <nav>
    <a href="/">数据</a>
    <a href="/check">自检</a>
    <a href="/project">项目</a>
    <a href="/digest" class="on">日报</a>
    <a href="/buyers.html">招标人</a>
    <a href="/model.html">模型</a>
    <a href="/simulator.html">模拟</a>
  </nav>
  <span class="meta" id="meta"></span>
</header>

<main>
  <div class="tabs">
    <button data-d="1">近 1 天</button>
    <button data-d="2" class="on">近 2 天</button>
    <button data-d="7">近 7 天</button>
    <button data-d="30">近 30 天</button>
    <span class="sp"></span>
    <button class="btn-x" id="exp">导出 CSV</button>
  </div>

  <div class="filters">
    <select id="fTag"><option value="">全部类型</option></select>
    <select id="fCity"><option value="">全部城市</option></select>
    <span class="hint">限价 ≥</span>
    <input id="fMin" type="number" min="0" step="100" placeholder="万">
    <span class="hint" id="cov"></span>
    <input id="fQ" type="text" placeholder="搜标题（不含正文）">
    <label><input type="checkbox" id="fAttach"> 只看有已下载附件</label>
    <button class="fil" id="fStar">★ 只看收藏</button>
    <button class="clr" id="fReset">重置</button>
  </div>

  <div id="kpi" class="kpi"></div>
  <div id="urgent"></div>
  <div id="list"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wan = (n) => (n == null ? null : (n / 1e4).toFixed(0) + ' 万');

// ---------- 本地存储（隐私模式下 try/catch 降级为内存） ----------
const mem = {};
const store = {
  get(k, dflt) {
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : dflt; } catch { return mem[k] ?? dflt; }
  },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch { mem[k] = v; }
  },
};
const K_READ = 'ahbid.digest.read.v1';
const K_FAV = 'ahbid.digest.fav.v1';

let READ = store.get(K_READ, {});       // {guid: 'YYYY-MM-DD'}
let FAV = new Set(store.get(K_FAV, [])); // Set<guid>
const READ_SET = new Set(Object.keys(READ));

// 清理 60 天前的已读，防止无限增长
{
  const cut = new Date(Date.now() - 60 * 864e5).toISOString().slice(0, 10);
  let dirty = false;
  for (const [g, d] of Object.entries(READ)) if (d < cut) { delete READ[g]; dirty = true; }
  if (dirty) store.set(K_READ, READ);
}

function markRead(guid, on) {
  if (on) { READ[guid] = new Date().toISOString().slice(0, 10); READ_SET.add(guid); }
  else { delete READ[guid]; READ_SET.delete(guid); }
  store.set(K_READ, READ);
}
function toggleFav(guid) {
  if (FAV.has(guid)) FAV.delete(guid); else FAV.add(guid);
  store.set(K_FAV, [...FAV]);
}

// ---------- 状态 ----------
const S = { days: 2, tag: '', city: '', q: '', min: 0, attach: false, star: false, data: null };

// ---------- 取数 ----------
async function load(days) {
  $('list').innerHTML = '<div class="empty">载入中…</div>';
  $('urgent').innerHTML = '';
  let j;
  try {
    j = await (await fetch('/api/digest?days=' + days)).json();
  } catch (e) {
    $('list').innerHTML = `<div class="err">${esc(e.message)}</div>`;
    return;
  }
  if (!j.ok) { $('list').innerHTML = `<div class="err">${esc(j.error)}</div>`; return; }
  S.data = j.data;
  S.days = days;
  $('meta').textContent = `统计截至 ${j.data.date}` + (j.cached ? ' · 缓存' : '');
  buildFilters();
  paint();
}

// ---------- 筛选选项 ----------
function buildFilters() {
  const d = S.data;
  const tags = new Map();
  const cities = new Map();
  let withAmount = 0;
  for (const it of d.items) {
    const t = it.tag || '__none';
    tags.set(t, (tags.get(t) ?? 0) + 1);
    if (it.city) cities.set(it.city, (cities.get(it.city) ?? 0) + 1);
    if (it.amount) withAmount++;
  }
  const TAG_CN = { pv: '光伏', storage: '储能', power: '电力', building: '房建', __none: '其他（未分类）' };
  $('fTag').innerHTML = '<option value="">全部类型</option>' + [...tags.entries()]
    .sort((a, b) => b[1] - a[1])
    .map(([t, n]) => `<option value="${esc(t)}">${esc(TAG_CN[t] ?? t)}（${n}）</option>`).join('');
  $('fCity').innerHTML = '<option value="">全部城市</option>' + [...cities.entries()]
    .sort((a, b) => b[1] - a[1])
    .map(([c, n]) => `<option value="${esc(c)}">${esc(c)}（${n}）</option>`).join('');

  // 关键：innerHTML 重建会把 select 的选中项清空，必须把状态写回去。
  // 不写回去就会出现「切换时间窗后下拉显示『全部类型』、列表却还是筛过的」——
  // 用户看到的现象就是「分类筛选没作用」。
  // 另外，旧选择在新窗口里可能不存在（比如「近 2 天」没有储能项目），
  // 这时要重置状态，否则会筛出 0 条却仍显示「全部类型」。
  if (S.tag && !tags.has(S.tag)) S.tag = '';
  if (S.city && !cities.has(S.city)) S.city = '';
  $('fTag').value = S.tag;
  $('fCity').value = S.city;
  const pct = d.items.length ? ((withAmount / d.items.length) * 100).toFixed(1) : '0.0';
  $('cov').textContent = `已知限价 ${withAmount}/${d.items.length}（${pct}%）`;
}

// ---------- 过滤 ----------
function filtered() {
  const q = S.q.trim().toLowerCase();
  const minYuan = S.min > 0 ? S.min * 1e4 : 0;
  return S.data.items.filter((it) => {
    if (S.tag === '__none' ? it.tag != null : S.tag && it.tag !== S.tag) return false;
    if (S.city && it.city !== S.city) return false;
    if (minYuan > 0 && !(it.amount && it.amount >= minYuan)) return false;
    if (S.attach && !it.hasAttach) return false;
    if (S.star && !FAV.has(it.guid)) return false;
    if (q && !(it.title || '').toLowerCase().includes(q)) return false;
    return true;
  });
}

// ---------- 渲染 ----------
function dueBadge(it) {
  const d = it.daysLeft;
  if (d === null || d === undefined) {
    return '<span class="due n" title="正文里没抽到可用的截止时间">截止未知</span>';
  }
  if (d < 0) return `<span class="due n" title="${esc(it.deadlineDate)}">已截止</span>`;
  const cls = d <= 3 ? 'r' : d <= 7 ? 'w' : 'n';
  const label = d === 0 ? '今天截止' : `还剩 ${d} 天`;
  const q = it.dlConf === 'medium'
    ? `<span class="q" title="原文里有多个日期，这是最接近锚点的：${esc(it.dlSource || '')}">?</span>`
    : '';
  return `<span class="due ${cls}" title="${esc(it.deadlineDate || '')}">${label}${q}</span>`;
}

function itemHtml(it, idx) {
  const read = READ_SET.has(it.guid) ? ' read' : '';
  const fav = FAV.has(it.guid) ? ' on' : '';
  const bits = [it.city, it.pubDate].filter(Boolean).map(esc);
  if (it.amount) bits.push('限价 <b>' + wan(it.amount) + '</b>');
  if (it.days) bits.push('工期 <b>' + it.days + '</b> 天');
  if (it.hasAttach) bits.push('<span style="color:var(--ok)">有附件</span>');
  return `<li class="item${read}" data-g="${esc(it.guid)}" data-i="${idx}">
    <span class="fav${fav}" title="收藏（s）">${FAV.has(it.guid) ? '★' : '☆'}</span>
    <div class="body">
      <div class="t"><a href="/project?g=${encodeURIComponent(it.guid)}">${esc(it.title)}</a></div>
      <div class="m">${bits.join(' · ')}${it.url ? ` · <a class="lnk" href="${esc(it.url)}" target="_blank" rel="noreferrer">原文</a>` : ''}</div>
    </div>
    ${dueBadge(it)}
  </li>`;
}

function paint() {
  const d = S.data;
  if (!d) return;
  const list = filtered();
  const total = d.items.length;

  // KPI 用后端 counts，不随筛选变 —— 否则一筛 KPI 就跟着跳，两个数互相打架
  const c = d.counts || {};
  $('kpi').innerHTML = `
    <div><b>${d.total}</b><span>${esc(d.date)} 新增</span></div>
    <div class="b"><b>${c.due3 ?? 0}</b><span>3 天内截止</span></div>
    <div class="w"><b>${c.due7 ?? 0}</b><span>7 天内截止</span></div>
    <div><b>${c.withAttach ?? 0}</b><span>有已下载附件</span></div>
    <div class="m"><b>${c.noDeadline ?? 0}</b><span>截止时间未知</span></div>`;

  // 紧急区：来自后端独立查询（全库 3 天内、confidence=high），不受当前窗口与筛选影响
  const urg = d.urgent || [];
  if (urg.length) {
    $('urgent').innerHTML = `<section class="urgent">
      <h2>⏰ 3 天内截止<em>全库 · 独立于上方时间窗</em></h2>
      <ul>${urg.slice(0, 20).map((it) => {
        const left = Math.round((Date.parse(it.date) - Date.parse(d.date)) / 864e5);
        return `<li class="item${READ_SET.has(it.guid) ? ' read' : ''}" data-g="${esc(it.guid)}">
          <span class="fav${FAV.has(it.guid) ? ' on' : ''}" title="收藏（s）">${FAV.has(it.guid) ? '★' : '☆'}</span>
          <div class="body">
            <div class="t"><a href="/project?g=${encodeURIComponent(it.guid)}">${esc(it.title)}</a></div>
            <div class="m">${esc(it.city || '')} · 发布 ${esc(it.pubDate)}</div>
          </div>
          <span class="due r">${left === 0 ? '今天截止' : `还剩 ${left} 天`}${it.hhmm ? ' ' + esc(it.hhmm) : ''}</span>
        </li>`;
      }).join('')}</ul>
      ${urg.length > 20 ? `<div class="more">还有 ${urg.length - 20} 条</div>` : ''}
    </section>`;
  } else {
    $('urgent').innerHTML = '';
  }

  // 分组列表
  const byTag = new Map();
  for (const it of list) {
    const k = it.tag || '__none';
    const arr = byTag.get(k) ?? [];
    arr.push(it);
    byTag.set(k, arr);
  }
  const TAG_CN = { pv: '光伏', storage: '储能', power: '电力', building: '房建', __none: '其他（未分类）' };

  let h = '';
  if (!list.length) {
    h = total === 0
      ? `<div class="empty">这个窗口内没有新增招标公告<br><br>如果刚过周末属正常；持续为空请检查爬虫日志 data/crawl.log</div>`
      : `<div class="empty">共 ${total} 条，当前筛选条件下没有匹配<br><br>${
          S.min > 0 ? '注意：限价覆盖率只有 ' + ($('cov').textContent.match(/（([\d.]+)%）/) || [,'?'])[1] + '%，大量公告没有限价，无法判断规模' : '试试重置筛选'
        }</div>`;
  } else {
    h = `<div style="font-size:12.5px;color:var(--ink-3);margin:0 0 8px 2px">
      筛选后 <b>${list.length}</b> / 共 ${total} 条</div>`;
    for (const [t, arr] of [...byTag.entries()].sort((a, b) => b[1].length - a[1].length)) {
      h += `<section><h2>${esc(TAG_CN[t] ?? t)}<em>${arr.length} 条</em></h2><ul>`;
      h += arr.map((it, i) => itemHtml(it, i)).join('');
      h += '</ul></section>';
    }
  }
  $('list').innerHTML = h;

  // 点行标记已读；点星切换收藏
  document.querySelectorAll('#list .item, #urgent .item').forEach((li) => {
    const g = li.dataset.g;
    li.querySelector('.fav').onclick = (e) => {
      e.stopPropagation();
      toggleFav(g);
      paint();
    };
    li.querySelector('.t a').addEventListener('click', () => { markRead(g, true); });
    li.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      if (READ_SET.has(g)) markRead(g, false); else markRead(g, true);
      li.classList.toggle('read');
    });
  });
}

// ---------- 事件 ----------
document.querySelectorAll('.tabs button[data-d]').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.tabs button[data-d]').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    const d = Number(b.dataset.d);
    history.replaceState(null, '', '/digest?days=' + d);
    load(d);
  };
});

let qTimer = null;
$('fQ').oninput = () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { S.q = $('fQ').value; paint(); }, 250);
};
$('fTag').onchange = () => { S.tag = $('fTag').value; paint(); };
$('fCity').onchange = () => { S.city = $('fCity').value; paint(); };
$('fMin').onchange = () => { S.min = Number($('fMin').value) || 0; paint(); };
$('fAttach').onchange = () => { S.attach = $('fAttach').checked; paint(); };
$('fStar').onclick = () => {
  S.star = !S.star;
  $('fStar').classList.toggle('on', S.star);
  paint();
};
$('fReset').onclick = () => {
  S.tag = ''; S.city = ''; S.q = ''; S.min = 0; S.attach = false; S.star = false;
  $('fTag').value = ''; $('fCity').value = ''; $('fQ').value = ''; $('fMin').value = '';
  $('fAttach').checked = false; $('fStar').classList.remove('on');
  paint();
};

// 导出：当前筛选后的结果。必须带 BOM，否则 Excel 打开中文是乱码
$('exp').onclick = () => {
  const list = filtered();
  if (!list.length) { alert('当前没有可导出的条目'); return; }
  const head = ['标题', '城市', '发布日期', '类型', '限价(元)', '工期(天)', '截止日期', '截止时刻', '剩余天数', '置信度', '有附件', '链接'];
  const rows = list.map((it) => [
    it.title, it.city || '', it.pubDate || '', it.tag || '',
    it.amount ?? '', it.days ?? '', it.deadlineDate || '', it.hhmm || '',
    it.daysLeft ?? '', it.dlConf || '', it.hasAttach ? '是' : '否', it.url || '',
  ]);
  const csv = '\uFEFF' + [head, ...rows]
    .map((r) => r.map((x) => `"${String(x).replace(/"/g, '""')}"`).join(','))
    .join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `招标日报-${S.data.date}-${S.days}天.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};

// 键盘：j/k 移动、Enter 打开、s 收藏、m 已读、/ 聚焦搜索
let focusIdx = -1;
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const items = [...document.querySelectorAll('#list .item, #urgent .item')];
  if (!items.length) return;

  const move = (n) => {
    focusIdx = Math.max(0, Math.min(items.length - 1, focusIdx + n));
    items.forEach((x) => x.classList.remove('focus'));
    const el = items[focusIdx];
    el.classList.add('focus');
    el.scrollIntoView({ block: 'nearest' });
  };
  const cur = () => (focusIdx >= 0 ? items[focusIdx] : null);

  if (e.key === 'j') { move(1); e.preventDefault(); }
  else if (e.key === 'k') { move(-1); e.preventDefault(); }
  else if (e.key === '/') { $('fQ').focus(); e.preventDefault(); }
  else if (e.key === 'Enter') {
    const el = cur();
    const a = el && el.querySelector('.t a');
    if (a) { a.click(); e.preventDefault(); }
  } else if (e.key === 's') {
    const el = cur();
    if (el) { toggleFav(el.dataset.g); paint(); e.preventDefault(); }
  } else if (e.key === 'm') {
    const el = cur();
    if (el) {
      const g = el.dataset.g;
      if (READ_SET.has(g)) markRead(g, false); else markRead(g, true);
      el.classList.toggle('read');
      e.preventDefault();
    }
  }
});

// ---------- 启动 ----------
const init = Number(new URLSearchParams(location.search).get('days') || 2);
document.querySelectorAll('.tabs button[data-d]').forEach((b) => b.classList.toggle('on', Number(b.dataset.d) === init));
load(init);
</script>
<script src="/nav.js"></script>
</body>
