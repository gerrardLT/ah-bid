<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>竞争格局 · 技术标数据底座</title>
<style>
:root{
  --bg:#EFEDE8;--panel:#fff;--line:#D5D1C7;--line-2:#E9E6DF;
  --ink:#0A0A09;--ink-2:#3B3630;--ink-3:#6E675E;
  --accent:#C8371A;--ok:#2E6B3E;--warn:#B26A00;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --m:"SF Mono","JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 var(--f);-webkit-font-smoothing:antialiased}
header{height:52px;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
header h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap}
header .meta{margin-left:auto;font:11.5px var(--m);color:var(--ink-3);white-space:nowrap}
main{max-width:1240px;margin:0 auto;padding:16px 20px 80px}

.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{padding:7px 16px;border:1px solid var(--line);background:var(--panel);font:13px var(--f);cursor:pointer;color:var(--ink-2)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);padding:10px 12px;margin-bottom:12px}
.filters select,.filters input{padding:6px 8px;border:1px solid var(--line);background:#FBFAF7;font:13px var(--f)}
.filters input{width:110px}
.filters .hint{font:11.5px var(--m);color:var(--ink-3)}
.filters .clr{border:0;background:transparent;color:var(--ink-3);font:12.5px var(--f);cursor:pointer;text-decoration:underline}

.kpi{display:flex;flex-wrap:wrap;border:1px solid var(--line);background:var(--panel);margin-bottom:12px}
.kpi div{flex:1 1 140px;padding:10px 15px;border-right:1px solid var(--line-2)}
.kpi div:last-child{border-right:0}
.kpi b{display:block;font:600 21px/1.2 var(--m)}
.kpi span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}

section{background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
section>h2{font-size:13px;font-weight:600;margin:0;padding:9px 14px;border-bottom:1px solid var(--line-2);display:flex;gap:8px;align-items:baseline}
section>h2 em{font:11.5px var(--m);color:var(--ink-3);font-style:normal;margin-left:auto}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:500 11.5px var(--m);color:var(--ink-3);padding:7px 10px;border-bottom:1px solid var(--line);background:#FBFAF7;white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FBFAF7}
td.k{font-family:var(--m);white-space:nowrap}
tr.thin td{opacity:.45}
tr.thin:hover{background:transparent}
.warn{color:var(--warn)}
.muted{color:var(--ink-3)}
.empty{padding:40px;text-align:center;color:var(--ink-3);font-size:13px}
.err{border:1px solid var(--accent);background:#FFF6F3;color:#8A2A12;padding:10px 14px;margin-bottom:12px;font-size:13px;white-space:pre-wrap}
.bar{display:inline-block;height:7px;background:var(--accent);opacity:.28;vertical-align:middle;margin-right:6px}
@media (max-width:760px){
  header h1{display:none}
  main{padding:12px}
  th:nth-child(3),td:nth-child(3){display:none}
}
</style>
</head>
<body>
<header>
  <h1>竞争格局</h1>
  <span class="meta" id="meta"></span>
</header>

<main>
  <div class="tabs">
    <button data-x="grid" class="on">矩阵</button>
    <button data-x="winner">中标单位</button>
    <button data-x="city">城市</button>
    <button data-x="type">行业</button>
    <button data-x="buyer">招标人</button>
  </div>

  <div class="filters">
    <select id="fCity"><option value="">全部城市</option></select>
    <select id="fType"><option value="">全部行业</option></select>
    <span class="hint">发布从</span><input id="fSince" type="date">
    <span class="hint">到</span><input id="fUntil" type="date">
    <select id="fN">
      <option value="1">全部出现</option>
      <option value="3">≥3 次</option>
      <option value="5" selected>≥5 次</option>
      <option value="10">≥10 次</option>
    </select>
    <button class="clr" id="fReset">重置</button>
  </div>

  <div class="kpi" id="kpi"></div>
  <div id="out"></div>
</main>

<!-- L3 公司画像：侧滑 480px，不跳页 -->
<div id="dw" style="display:none;position:fixed;inset:0;z-index:200">
  <div onclick="closeCompany()" style="position:absolute;inset:0;background:rgba(0,0,0,.28)"></div>
  <div style="position:absolute;right:0;top:0;bottom:0;width:480px;max-width:92vw;background:#fff;
       box-shadow:-6px 0 22px rgba(0,0,0,.12);overflow:auto;padding:16px 18px">
    <button onclick="closeCompany()"
      style="float:right;border:0;background:transparent;font:20px/1 var(--m);cursor:pointer;color:#6E675E">×</button>
    <div id="dwBody"></div>
  </div>
</div>

<script src="/nav.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (x) => (x == null ? '—' : (x * 100).toFixed(1) + '%');
const money = (x) => (x == null ? '—' : x >= 1e8 ? (x / 1e8).toFixed(2) + ' 亿' : (x / 1e4).toFixed(0) + ' 万');
const wan = (x) => (x == null ? '—' : (x / 1e4).toFixed(0) + ' 万');

const S = { x: 'grid', city: '', type: '', seg: '', cityOther: 0, since: '', until: '', minN: 5 };

// ---------- L1 矩阵 ----------
// 底色编码「样本量」而不是下浮率：实测 106 格里 71 格没有下浮率，
// 按 rate 着色会让 2/3 的格子同色，矩阵就失去意义。
async function loadGrid() {
  // 矩阵视图下城市/行业下拉是冗余的（它们在矩阵里是「维度」不是「筛选」），
  // 留着会让人以为能在矩阵上再加筛选。时间窗保留，minN 对矩阵无意义也隐藏。
  $('fCity').style.display = 'none';
  $('fType').style.display = 'none';
  $('fN').style.display = 'none';
  $('out').innerHTML = '<div class="empty">载入中…</div>';
  let j;
  try {
    const q = new URLSearchParams({ x: 'segment' });
    if (S.since) q.set('since', S.since);
    if (S.until) q.set('until', S.until);
    j = await (await fetch('/api/market-grid?' + q)).json();
  } catch (e) {
    $('out').innerHTML = `<div class="err">${esc(e.message)}</div>`;
    return;
  }
  if (!j.ok) { $('out').innerHTML = `<div class="err">${esc(j.error)}</div>`; return; }
  renderMatrix(j);
}

function renderMatrix(j) {
  const maxN = Math.max(1, ...j.rows.flatMap((r) => r.cells.map((c) => c.n || 0)));
  // 底色四档：<5 不填、5-20 浅、20-80 中、>80 深
  const bg = (n) => {
    if (!n) return 'transparent';
    if (n < 5) return 'rgba(200,55,26,0.05)';
    if (n < 20) return 'rgba(200,55,26,0.12)';
    if (n < 80) return 'rgba(200,55,26,0.24)';
    return 'rgba(200,55,26,0.38)';
  };

  $('meta').textContent = `事实表 ${j.meta.generatedAt.slice(0, 16).replace('T', ' ')} · ${j.meta.total} 条`;
  $('kpi').innerHTML = `
    <div><b>${j.meta.total}</b><span>中标记录</span></div>
    <div><b>${j.rows.length}</b><span>城市</span></div>
    <div><b>${j.meta.cells}</b><span>非空格子</span></div>
    <div><b>${j.meta.rateCells}</b><span>下浮率样本≥5 的格</span></div>`;

  let h = `<section><h2>城市 × 行业<em>点格子看该组合的中标单位</em></h2>
    <div style="overflow-x:auto"><table style="min-width:820px"><thead><tr>
      <th style="width:88px">城市</th>
      ${j.cols.map((c) => `<th class="r" style="width:72px">${esc(c)}</th>`).join('')}
      <th class="r" style="width:64px;border-left:1px solid var(--line)">合计</th>
    </tr></thead><tbody>`;

  for (const r of j.rows) {
    h += `<tr${r.thin ? ' class="thin"' : ''}>
      <td>${esc(r.city)}${r.thin ? ' <span class="warn" style="font-size:11px" title="样本不足 30 条，可能是采集缺口">⚠</span>' : ''}</td>`;
    for (const c of r.cells) {
      if (!c.n) { h += '<td class="r muted">·</td>'; continue; }
      const rateTxt = c.rn >= 5 && c.med != null
        ? `<div style="font:10.5px var(--m);color:var(--ink-3)">${(c.med * 100).toFixed(1)}%</div>`
        : '';
      const clickable = c.n >= 5;
      h += `<td class="r k" style="background:${bg(c.n)};${clickable ? 'cursor:pointer' : 'opacity:.55'}"
        ${clickable ? `onclick="pickCell('${esc(r.city)}','${esc(c.t)}')"` : 'title="样本不足 5 条，不下结论"'}>
        ${c.n}${rateTxt}</td>`;
    }
    h += `<td class="r k" style="border-left:1px solid var(--line);font-weight:600">${r.total}</td></tr>`;
  }
  h += `</tbody></table></div>
    <div style="padding:9px 14px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line-2)">
      底色深浅 = 样本量；格内小字 = 下浮率中位（仅 ≥5 个样本时显示）；
      灰字 = 样本不足 5 条；⚠ = 该城市不足 30 条，多半是采集缺口而不是没项目
    </div></section>`;
  $('out').innerHTML = h;
}

// 点格子 → L2 格子详情（不再切 tab：那会丢掉格首的分散度摘要）
async function pickCell(city, seg) {
  S.cell = { city, seg };
  $('out').innerHTML = '<div class="empty">载入中…</div>';
  const q = new URLSearchParams();
  if (city !== '其他') q.set('city', city); else q.set('city_other', '1');
  q.set('seg', seg);
  if (S.since) q.set('since', S.since);
  if (S.until) q.set('until', S.until);
  let j;
  try {
    j = await (await fetch('/api/market-cell?' + q)).json();
  } catch (e) {
    $('out').innerHTML = `<div class="err">${esc(e.message)}</div>`;
    return;
  }
  if (!j.ok) { $('out').innerHTML = `<div class="err">${esc(j.error)}</div>`; return; }
  renderCell(j, city, seg);
}

function renderCell(j, city, seg) {
  const b = j.brief;
  const maxTop = Math.max(1, ...j.top.map((x) => x.n));
  const maxMon = Math.max(1, ...j.months.map((x) => x.n));
  const maxHist = Math.max(1, ...j.hist);

  let h = `<div style="margin-bottom:10px">
    <button class="btn-x" onclick="loadGrid()">← 返回矩阵</button>
    <span style="margin-left:10px;font-weight:600">${esc(city)} › ${esc(seg)}</span>
  </div>`;

  // 格首摘要：三个数字直接回答"这个市场什么样"
  h += `<section><h2>这个格子<em>${b.n} 条</em></h2><div class="body">
    <div class="kpi" style="margin:0;border:0">
      <div><b>${b.n}</b><span>中标记录</span></div>
      <div><b>${b.winners}</b><span>参与单位</span></div>
      <div><b>${b.topShare == null ? '—' : (b.topShare * 100).toFixed(1) + '%'}</b><span>首名占比</span></div>
      <div><b>${b.rateN}</b><span>可配对下浮率</span></div>
    </div>
    <div style="padding:9px 14px;font-size:12px;color:${b.topShare != null && b.topShare < 0.05 ? 'var(--warn)' : 'var(--ink-3)'}">
      ${b.topShare != null && b.topShare < 0.05
        ? `极度分散：${b.winners} 家单位分 ${b.n} 单，首名只占 ${(b.topShare * 100).toFixed(1)}% —— 这个市场没有霸主`
        : `首名占 ${(b.topShare * 100).toFixed(1)}%，有一定集中度`}
    </div>
  </div></section>`;

  // Top20 + 直方图
  h += `<section><h2>中标单位 Top${j.top.length}<em>点公司看画像</em></h2>
    <table><thead><tr><th style="width:32px">#</th><th>单位</th>
      <th class="r" style="width:64px">中标</th><th class="r" style="width:80px">下浮中位</th>
      <th class="r" style="width:56px">样本</th></tr></thead><tbody>`;
  j.top.forEach((x, i) => {
    const rateCell = x.rateMed == null
      ? '<span class="muted">—</span>'
      : `${(x.rateMed * 100).toFixed(1)}%${x.rateN < 5 ? ' <span class="warn">?</span>' : ''}`;
    h += `<tr onclick="openCompany('${esc(x.key).replace(/'/g, "\\'")}')" style="cursor:pointer">
      <td class="muted">${i + 1}</td>
      <td><span class="bar" style="width:${Math.round(x.n / maxTop * 50)}px"></span>${esc(x.key)}</td>
      <td class="r k">${x.n}</td>
      <td class="r k">${rateCell}</td>
      <td class="r k">${x.rateN}</td></tr>`;
  });
  h += '</tbody></table></section>';

  h += `<section><h2>下浮率分布<em>${b.rateN} 个样本</em></h2><div class="body">`;
  if (b.rateN < 5) {
    h += `<span class="muted">样本不足 5 个（${b.rateN}），不做分布结论。
      控制价数据集中在少数城市，这个格子的招标文件多半没下载到。</span>`;
  } else {
    h += j.hist.map((n, i) => `<div style="display:flex;align-items:center;gap:8px;margin:2px 0">
      <span style="width:64px;font:11px var(--m);color:var(--ink-3)">${i * 5}-${i * 5 + 5}%</span>
      <span class="bar" style="width:${Math.round(n / maxHist * 240)}px;height:12px"></span>
      <span class="k" style="font-size:11.5px">${n}</span></div>`).join('');
  }
  h += '</div></section>';

  // 月度趋势
  if (j.months.length > 1) {
    h += `<section><h2>月度趋势<em>${j.months.length} 个月</em></h2><div class="body">`;
    h += j.months.map((m) => `<div style="display:flex;align-items:center;gap:8px;margin:2px 0">
      <span style="width:64px;font:11px var(--m);color:var(--ink-3)">${m.m}</span>
      <span class="bar" style="width:${Math.round(m.n / maxMon * 240)}px;height:12px"></span>
      <span class="k" style="font-size:11.5px">${m.n}</span></div>`).join('');
    h += '</div></section>';
  }

  $('out').innerHTML = h;
}

// L3 公司画像（侧滑，不跳页 —— 看对手是连续动作，跳页会打断）
async function openCompany(w) {
  const box = $('dw');
  box.style.display = 'block';
  $('dwBody').innerHTML = '<div class="empty">载入中…</div>';
  let j;
  try {
    j = await (await fetch('/api/company?w=' + encodeURIComponent(w))).json();
  } catch (e) {
    $('dwBody').innerHTML = `<div class="err">${esc(e.message)}</div>`;
    return;
  }
  if (!j.ok) { $('dwBody').innerHTML = `<div class="err">${esc(j.error)}</div>`; return; }

  const maxMon = Math.max(1, ...j.curve.map((x) => x.n));
  const maxCity = Math.max(1, ...j.cityDist.map((x) => x.n));

  let h = `<div style="font-weight:600;font-size:15px;margin-bottom:4px">${esc(j.name)}</div>
    <div class="muted" style="font-size:12.5px;margin-bottom:14px">
      中标 ${j.n} 次 · 覆盖 ${j.cities} 城 · 累计 ${j.winSum ? (j.winSum / 1e8).toFixed(2) + ' 亿' : '—'}
    </div>`;

  h += `<div style="font:600 12px var(--m);color:var(--ink-3);margin:14px 0 6px">中标曲线</div>`;
  h += j.curve.map((m) => `<div style="display:flex;align-items:center;gap:8px">
    <span style="width:58px;font:11px var(--m);color:var(--ink-3)">${m.m}</span>
    <span class="bar" style="width:${Math.round(m.n / maxMon * 200)}px;height:11px"></span>
    <span class="k" style="font-size:11px">${m.n}</span></div>`).join('');

  h += `<div style="font:600 12px var(--m);color:var(--ink-3);margin:16px 0 6px">活动半径</div>`;
  h += j.cityDist.slice(0, 8).map((m) => `<div style="display:flex;align-items:center;gap:8px">
    <span style="width:58px;font:11px var(--m);color:var(--ink-3)">${esc(m.c)}</span>
    <span class="bar" style="width:${Math.round(m.n / maxCity * 200)}px;height:11px"></span>
    <span class="k" style="font-size:11px">${m.n}</span></div>`).join('');

  h += `<div style="font:600 12px var(--m);color:var(--ink-3);margin:16px 0 6px">报价习惯</div>`;
  if (j.rateN < 5) {
    h += `<div class="warn" style="font-size:12px">⚠ ${j.n} 单里只有 ${j.rateN} 单能配对下浮率，样本不足，不下结论</div>`;
  } else {
    h += `<div style="font-size:13px">下浮率中位 <b>${(j.rateMed * 100).toFixed(1)}%</b>（${j.rateN} 个样本）</div>`;
  }

  h += `<div style="font:600 12px var(--m);color:var(--ink-3);margin:16px 0 6px">项目明细（最近 ${j.rows.length} 条）</div>`;
  h += j.rows.map((r) => `<div style="padding:5px 0;border-bottom:1px solid var(--line-2);font-size:12.5px">
    <a href="/project?g=${encodeURIComponent(r.guid)}" style="color:var(--ink);text-decoration:none">${esc(r.title.slice(0, 34))}</a>
    <div class="muted" style="font:11px var(--m)">${esc(r.city || '')} · ${esc(r.pubDate || '')}${r.rate != null ? ' · 下浮 ' + (r.rate * 100).toFixed(1) + '%' : ''}</div>
  </div>`).join('');

  $('dwBody').innerHTML = h;
}

function closeCompany() { $('dw').style.display = 'none'; }

async function load() {
  $('fCity').style.display = '';
  $('fType').style.display = '';
  $('fN').style.display = '';
  $('out').innerHTML = '<div class="empty">载入中…</div>';
  const q = new URLSearchParams({ x: S.x, limit: '2000' });
  if (S.city) q.set('city', S.city);
  if (S.cityOther) q.set('city_other', '1');
  if (S.type) q.set('type', S.type);
  if (S.seg) q.set('seg', S.seg);
  if (S.since) q.set('since', S.since);
  if (S.until) q.set('until', S.until);

  let j;
  try {
    j = await (await fetch('/api/market?' + q)).json();
  } catch (e) {
    $('out').innerHTML = `<div class="err">${esc(e.message)}</div>`;
    return;
  }
  if (!j.ok) {
    $('out').innerHTML = `<div class="err">${esc(j.error)}</div>`;
    return;
  }
  fillFacets(j.facets);
  render(j);
}

function fillFacets(f) {
  if (!f) return;
  // 无条件重建：原来用 options.length <= 1 做守卫，但 pickCell() 会把下拉重建成
  // 「全部 + 选中项」两项，此后守卫永远为假 → 用户再也换不了城市/行业，重置也救不回。
  const build = (cur, list, all) => {
    const vals = [...new Set([...(cur ? [cur] : []), ...list])];
    return `<option value="">${all}</option>` +
      vals.map((v) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(v)}</option>`).join('');
  };
  $('fCity').innerHTML = build(S.city, f.cities || [], '全部城市');
  $('fType').innerHTML = build(S.type, f.types || [], '全部行业');
}

function render(j) {
  const rows = j.rows.filter((r) => r.n >= S.minN);
  const total = j.rows.reduce((a, r) => a + r.n, 0);
  const withRate = j.rows.filter((r) => r.rateN >= 5);
  const maxN = Math.max(1, ...rows.map((r) => r.n));

  $('meta').textContent = `事实表 ${j.meta.generatedAt.slice(0, 16).replace('T', ' ')} · ${j.meta.total} 条中标记录`;

  $('kpi').innerHTML = `
    <div><b>${j.meta.total}</b><span>中标记录总数</span></div>
    <div><b>${j.meta.filtered}</b><span>当前筛选命中</span></div>
    <div><b>${j.rows.length}</b><span>${S.x === 'winner' ? '家中标单位' : '个分组'}</span></div>
    <div><b>${withRate.length}</b><span>下浮率样本 ≥5 的组</span></div>
    <div><b>${j.meta.source?.ctrl ?? 0}</b><span>控制价记录（配对上限）</span></div>`;

  if (!rows.length) {
    $('out').innerHTML = `<div class="empty">当前条件下没有 ≥${S.minN} 次的组<br><br>
      把「全部出现」调出来可以看到长尾</div>`;
    return;
  }

  const label = { winner: '中标单位', city: '城市', type: '行业', buyer: '招标人' }[S.x];
  const showCities = S.x === 'winner' || S.x === 'buyer';

  let h = `<section><h2>${label}排行<em>${rows.length} 组 · 按次数降序</em></h2>
    <table><thead><tr>
      <th style="width:36px">#</th><th>${label}</th>
      <th class="r" style="width:70px">中标次数</th>
      ${showCities ? '<th class="r" style="width:64px">覆盖城市</th>' : ''}
      <th class="r" style="width:96px">下浮率中位</th>
      <th class="r" style="width:64px">样本 n</th>
      <th class="r" style="width:96px">中标额合计</th>
    </tr></thead><tbody>`;

  rows.forEach((r, i) => {
    const thin = r.n < 5 ? ' class="thin"' : '';
    const rateCell = r.rateMed == null
      ? '<span class="muted" title="该项目没有可配对的控制价">—</span>'
      : `${pct(r.rateMed)}${r.rateN < 5 ? ' <span class="warn" title="样本不足 5，仅供参考">?</span>' : ''}`;
    h += `<tr${thin}>
      <td class="muted">${i + 1}</td>
      <td><span class="bar" style="width:${Math.round(r.n / maxN * 60)}px"></span>${esc(r.key || '(空)')}</td>
      <td class="r k">${r.n}</td>
      ${showCities ? `<td class="r k" title="${esc((r.cityList || []).join('、'))}">${r.cities}</td>` : ''}
      <td class="r k">${rateCell}</td>
      <td class="r k ${r.rateN === 0 ? 'muted' : ''}">${r.rateN}</td>
      <td class="r k">${money(r.winSum)}</td>
    </tr>`;
  });
  h += '</tbody></table>';

  if (withRate.length < 5) {
    h += `<div style="padding:10px 14px;font-size:12px;color:var(--warn);border-top:1px solid var(--line-2)">
      只有 ${withRate.length} 个分组有 ≥5 个下浮率样本 —— 控制价数据集中在少数城市，
      阜阳/滁州/淮南/安庆/六安的招标文件没下载到，这些城市的下浮率无法计算。</div>`;
  }
  h += '</section>';
  $('out').innerHTML = h;
}

document.querySelectorAll('.tabs button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    S.x = b.dataset.x;
    // 矩阵走独立接口；其他 4 个 tab 仍走原来的 /api/market（那一套有 5 条回归断言）
    if (S.x === 'grid') loadGrid();
    else load();
  };
});
// 矩阵 tab 下改日期/重置必须走 loadGrid，否则会请求 /api/market?x=grid 直接报错
const refresh = () => (S.x === 'grid' ? loadGrid() : load());
$('fCity').onchange = () => {
  const v = $('fCity').value;
  S.cityOther = v === '__other' ? 1 : 0;
  S.city = v === '__other' ? '' : v;
  refresh();
};
// 行业下拉在矩阵下钻后装的是 segment 值，所以写 S.seg 而不是 S.type
$('fType').onchange = () => { S.seg = $('fType').value; S.type = ''; refresh(); };
$('fSince').onchange = () => { S.since = $('fSince').value; refresh(); };
$('fUntil').onchange = () => { S.until = $('fUntil').value; refresh(); };
$('fN').onchange = () => { S.minN = Number($('fN').value); refresh(); };
$('fReset').onclick = () => {
  S.city = ''; S.type = ''; S.seg = ''; S.cityOther = 0; S.since = ''; S.until = ''; S.minN = 5;
  $('fCity').value = ''; $('fType').value = ''; $('fSince').value = ''; $('fUntil').value = ''; $('fN').value = '5';
  refresh();
};

// 默认进矩阵（tabs 里 grid 是第一个且带 on）
loadGrid();
</script>
</body>
</html>
